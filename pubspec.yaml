name: masar_finance
description: qdaash, an offline-first personal finance tracker.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.7.2
  flutter: '>=3.29.2'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.0.0
  intl: ^0.19.0
  sqflite: ^2.4.2
  path: ^1.9.1
  shared_preferences: ^2.5.3
  image_picker: ^1.2.1
  flutter_secure_storage: ^10.3.4
  local_auth: ^2.3.0
  path_provider: ^2.1.5
  file_picker: ^11.0.3
  pdf: ^3.11.3
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  cryptography: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: 2.3.6

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/brand/gaddash_wallet_logo.png
  fonts:
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
